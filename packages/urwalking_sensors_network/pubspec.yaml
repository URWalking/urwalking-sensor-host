name: urwalking_sensors_network
description: "Sends urwalking_sensors recordings to a PC: live over TCP and as an archive upload. Pure Dart, no dependencies."
version: 0.1.0
publish_to: "none"
resolution: workspace

environment:
  sdk: ^3.11.5

dependencies:
  urwalking_sensors: ^0.1.0

dev_dependencies:
  # Only used by the tests, to check the uploaded tar independently.
  archive: ^3.6.1
  test: ^1.25.0
