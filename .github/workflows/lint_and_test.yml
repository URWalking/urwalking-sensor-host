name: Lint & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.11.5'
      
      - name: Install dependencies
        run: flutter pub get
        
      - name: Analyze project source via linting rules
        run: dart analyze

      - name: Run tests
        run: flutter test
