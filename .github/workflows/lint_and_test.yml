name: Lint & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.5'
      
      - name: Install dependencies
        run: flutter pub get
        
      - name: Analyze library (no lint findings allowed)
        run: dart analyze --fatal-infos lib test

      - name: Analyze example app
        run: dart analyze example

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Run tests
        run: flutter test
