name: urwalking_sensors_workspace
description: "Workspace root. The packages live in packages/, the demo app in example/."
publish_to: "none"

environment:
  sdk: ^3.11.5

workspace:
  - packages/urwalking_sensors
  - packages/urwalking_sensors_bluetooth
  - packages/urwalking_sensors_compass
  - packages/urwalking_sensors_location
  - packages/urwalking_sensors_motion
  - packages/urwalking_sensors_pedometer
  - packages/urwalking_sensors_wifi
  - example

dev_dependencies:
  flutter_lints: ^6.0.0
